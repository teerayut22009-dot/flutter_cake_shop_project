name: flutter_cake_shop_project
description: แอปสายด่วนกินเค้ก — Flutter course project from supplied reference screens.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  carousel_slider: ^5.1.2
  flutter_map: ^8.3.2
  url_launcher: ^6.3.3
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/images/icon.png'
  web:
    generate: true
    image_path: 'assets/images/icon.png'
    background_color: '#FFFFFF'
    theme_color: '#FF0808'
